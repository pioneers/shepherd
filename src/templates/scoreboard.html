<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Setup Screen</title>
    <script type="text/javascript" src={{url_for( 'static' , filename='socket.io.js' )}}></script>
    <script type="text/javascript" src={{url_for( 'static' , filename='jquery-1.12.3.min.js' )}}></script>
    <script type="text/javascript" src={{url_for( 'static' , filename='scoreboard.js' )}}></script>
    <link rel="stylesheet" href="{{url_for('static', filename='scoreboard.css')}}">
</head>
<body>
    <div class="container">
        <div id="round-info" class="header-box">
            <div class="banner-container">
                <!-- <div class="rope1"></div>
                <div class="blue-banner">
                    <h3 class="blue-banner-text">Blue Alliance</h3>
                </div> -->
                <img class="blue-rope" src="../static/banners/rope.png">
                <img class="blue-banner" src="../static/banners/blue_banner.png">
                <h3 class="blue-banner-text">Blue Alliance</h3>
            </div>
            <div class="middle-section">
                <img class="time-container" src="../static/timer.png">
                <div id="timer" class="time">0:00</div>
                <!-- <div class="time-container">
                    <div id="timer" class="time">1:00</div>
                </div> -->
                <!-- <div class="vertical-divider"></div> -->
                <div id="stage" class="setup-label">Loading...</div>
            </div>
            <div class="banner-container">
                <!-- <div class="rope2"></div>
                <div class="gold-banner">
                    <h3 class="gold-banner-text">Gold Alliance</h3>
                </div> -->
                <img class="gold-rope" src="../static/banners/rope.png">
                <img class="gold-banner" src="../static/banners/gold_banner.png">
                <h3 class="gold-banner-text">Gold Alliance</h3>
            </div>
        </div>

        <div class="teams-container">
            <div class="team">
                <!-- <div class="team-name">Blue Alliance</div> -->
                <div id="score-blue" class="team-score" data-score="5">...</div>
            </div>
            <div class="team">
                <!-- <div class="team-name">Gold Alliance</div> -->
                <div id="score-gold" class="team-score"data-score="7">...</div>
            </div>
        </div>

        <div class="schools-container" style="z-index: 100; position: relative;">
            <div class="schools-wrap">
                <div id="team-name-b1" class="school-box">SCHOOL1</div>
                <div id="team-name-b2" class="school-box">SCHOOL2</div>
            </div>
            <div class="schools-wrap">
                <div id="team-name-g1" class="school-box">SCHOOL1</div>
                <div id="team-name-g2" class="school-box">SCHOOL2</div>
            </div>
        </div>
    </div>

    <div class="progress-bar">
        <div class="progress-fill"></div>
    </div>

    <div id="ship-animation" class="sail" style="z-index: 1;">
        <img src="../static/pirate-ship.png" style="animation: upDown 7s ease infinite;" alt="Pirate Ship" id="ship">
    </div>

    <div class="wave-container" style="animation: moveRight 12s linear infinite;">
        <img class="waves" style="animation: upDown 10s ease infinite;" src="../static/wave_images/fourth_wave.png"> 
        <img class="waves" style="animation: upDown 10s ease infinite;" src="../static/wave_images/fourth_wave.png">
    </div>
    
    <div class="wave-container" style="animation: moveRight 8s linear infinite;">
        <img class="waves" style="animation: upDown 10s ease infinite;" src="../static/wave_images/third_wave.png"> 
        <img class="waves" style="animation: upDown 10s ease infinite;" src="../static/wave_images/third_wave.png">
    </div>
    
    <div class="wave-container" style="animation: moveRight 5s linear infinite; z-index: 1;">
        <img class="waves" style="animation: upDown 10s ease infinite;" src="../static/wave_images/second_wave.png"> 
        <img class="waves" style="animation: upDown 10s ease infinite;" src="../static/wave_images/second_wave.png">
    </div>
    
    <div class="wave-container" style="animation: moveRight 3s linear infinite; z-index: 2;">
        <img class="waves" style="animation: upDown 10s ease infinite;" src="../static/wave_images/first_wave.png"> 
        <img class="waves" style="animation: upDown 10s ease infinite;" src="../static/wave_images/first_wave.png">
    </div>

    <script src="script.js"></script>
</body>
</html>
