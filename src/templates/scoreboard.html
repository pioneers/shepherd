<html>

<head>
    <script type="text/javascript" src={{url_for( 'static' , filename='socket.io.js' )}}></script>
    <script type="text/javascript" src={{url_for( 'static' , filename='jquery-1.12.3.min.js' )}}></script>
    <script type="text/javascript" src={{url_for( 'static' , filename='scoreboard.js' )}}></script>
    <link rel="stylesheet" href="{{url_for('static', filename='scoreboard.css')}}">
</head>

<div id = "sky-background">
    <div id = "info-container">

        <!-- Blue Alliance Information -->
        <section>
            <p id = "team-name-b1">Team 1</p>
            <p id = "score-blue">Blue</p>
            <p id = "team-name-b2">Team 2</p>
        </section>

        <!-- Round Information -->
        <section>
            <p id = "match">Pioneers in Engineering</p>
            <p id = "timer">Get Ready!</p>
            <p id = "stage">Setting up</p>
        </section>

        <!-- Gold Alliance Information -->
        <section>
            <p id = "team-name-g1">Team 1</p>
            <p id = "score-gold">Gold</p>
            <p id = "team-name-g2">Team 2</p>
        </section>
    </div>

    <div id = "svg-container-one">
        <img src = "../static/blue.svg">
        <img src = "../static/gold.svg">
    </div>

    <div id = "svg-container-two">
        <img src = "../static/blue.svg">
        <img src = "../static/gold.svg">
    </div>

    <div id = "light"></div>

    <img src = "../static/alcatraz_one.png" id = "alcatraz">

    <div id = "waves_container">
        <img src = "../static/waves.png" id = "waves">
    </div>

    <video autoplay muted loop id = "rain-background">
        <source src="../static/rain.webm" type="video/webm">
    </video>
</div>

</html>
